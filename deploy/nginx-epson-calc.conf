# Epson 투사거리 계산기 - nginx 설정 (정적 파일)
# 위치: /etc/nginx/sites-available/epson-calc
server {
    listen 80;
    server_name _;                      # 도메인이 있으면 _ 대신 도메인 입력 (예: calc.example.com)

    root /var/www/epson-calc;
    index index.html;

    # 직원만 쓰도록 비밀번호 보호 (아이디/비밀번호는 htpasswd 로 생성)
    auth_basic "Epson Calculator";
    auth_basic_user_file /etc/nginx/.htpasswd-epson;

    location / {
        try_files $uri $uri/ =404;
    }
}
